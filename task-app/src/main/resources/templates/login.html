<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ログイン - Quest Menu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        <h1><span class="en-title">Login</span><br>ギルドへの入場</h1>

        <div th:if="${param.error}" style="color: #d9534f; text-align: center; margin-bottom: 20px;">
            ユーザー名かパスワードが間違っています。
        </div>

        <form th:action="@{/login}" method="post">
            <div style="margin-bottom: 20px;">
                <input type="text" name="username" placeholder="ユーザー名 (現在は user)" required>
            </div>
            <div style="margin-bottom: 20px;">
                <input type="password" name="password" placeholder="パスワード (合言葉)" required>
            </div>
            <button type="submit">入場する</button>
        </form>
    </div>
</body>

</html>
