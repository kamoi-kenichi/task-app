spring.application.name=task-app

spring.datasource.url=jdbc:mysql://localhost:3306/task_app_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

app.admin.username=${ADMIN_USERNAME:local_admin}
app.admin.password=${ADMIN_PASSWORD:local_dummy_password}